<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Generate Quote</title>
    <link rel="stylesheet" href="/static/css.css">
    </link>
    <script src="static/scripts.js"></script>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
</head>

<body>
    <div class="column" id="left">
        <table class="table" id="dialog">
        </table>
        <table class="table">
            <tr>
                <td>Explanation</td>
                <td><input type="text" class="quote" id="explanation"></td>
            </tr>
            <tr>
                <td>Data</td>
                <td><input type="date" class="quote" id="date"></td>
            </tr>
        </table>
        <div>
            <input class="buttons" type="button" onclick="generate_quote();triggerCommand()" value="Submit"></input>
            <input class="buttons" type="submit" onclick="location.reload(false)" value="Clear"></input>
        </div>
        <textarea id="quote_output" name="output" rows="4" hidden disabled></textarea>
    </div>
    
</body>
<div id="background">
    <div class="runes-container" style="left: 22%;top: 37vh;">
        <div class="rune" style="animation-delay: 1.25s;">ᚠ</div>
        <div class="rune" style="animation-delay: 1.75s;">ᚢ</div>
        <div class="rune" style="animation-delay: 2.25s;">ᚦ</div>
    </div>
</div>
<script type="text/javascript">
    clear_output()
    for(j=0; j < 200; j++){
        document.getElementById("background").appendChild(generate_rune_for_background());
    }
</script>

</html>
