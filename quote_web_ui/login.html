<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Password Verification</title>
    <link rel="stylesheet" href="/static/css.css"></link>
    <link rel="icon" type="image/x-icon" href="/static/favicon.png">
</head>

<body>
<form method="post">
    <div class="column" style="padding-top: 0px; background-position: center">
        <p>{{message}}</p>
        <input type="password" name="password" placeholder="Enter password" required style="font-size: 24px">
        <button class="buttons" type="submit">Login</button>
    </div>
    <div id="background"></div>
</form>
</body>
</html>
